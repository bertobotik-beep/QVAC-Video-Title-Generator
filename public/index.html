<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Video Title Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #fdf2f8 0%, #fce7f3 100%);
    font-family: system-ui, -apple-system, sans-serif;
    color: #831843;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 580px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #be185d; font-weight: 800; text-align: center; }
  .subtitle { color: #a15275; margin-bottom: 24px; font-size: 0.9rem; text-align: center; }
  .card {
    background: #ffffff;
    border: 2px solid #fbcfe8;
    border-radius: 16px;
    padding: 28px 26px;
  }
  textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #fbcfe8;
    background: #fffafc;
    color: #831843;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 16px;
    resize: vertical;
    min-height: 100px;
  }
  button.action {
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: #db2777;
    color: #fff;
    width: 100%;
  }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #a15275; min-height: 1.2em; text-align: center; }
  ul.results { list-style: none; padding: 0; margin: 20px 0 0; }
  ul.results li {
    background: #fdf2f8;
    border-left: 4px solid #db2777;
    padding: 12px 14px;
    margin-bottom: 10px;
    border-radius: 8px;
    font-size: 1.02rem;
    font-weight: 600;
  }
  .footer-note { color: #a15275; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid #fce7f3;
    border-top-color: #db2777;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>QVAC Video Title Generator</h1>
    <p class="subtitle">Describe your video's content, get 3-5 title options. 100% on-device.</p>

    <div class="card">
      <textarea id="mainInput" placeholder="e.g. A 10-minute video where I take apart an old mechanical keyboard, clean every switch, and put it back together."></textarea>
      <button class="action" id="generateBtn">Generate Titles</button>
      <div class="status" id="status"></div>
      <ul class="results" id="resultBox"></ul>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const mainInput = document.getElementById('mainInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const value = mainInput.value.trim();
      if (!value) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Thinking of titles...';

      try {
        const res = await fetch('/api/videotitle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ description: value }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = data.titles.map((t) => `<li>${escapeHtml(t)}</li>`).join('');
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    mainInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) generate();
    });
  </script>
</body>
</html>
